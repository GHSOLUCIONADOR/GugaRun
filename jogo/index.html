:root{--blue:#2b33a8;--blue-ink:#1c2278;--orange:#f26a1b;--night:#0e1233;--yellow:#ffd25a;--gold:#ffb000;--green:#2fbf71;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:"PS2P",monospace;color:#fff}
/* Tela vertical 9:16 que se ajusta ao monitor */
#app{position:relative;height:100vh;width:calc(100vh*9/16);max-width:100vw;max-height:calc(100vw*16/9);display:flex;flex-direction:column;background:var(--night);container-type:inline-size;overflow:hidden}
#game{position:relative;width:100%;aspect-ratio:3/4;flex:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2cqw;text-align:center;padding:4cqw 6.5cqw}
.ov[hidden]{display:none}
#entry,#board{background:rgba(14,18,51,.86)}
.big{font-size:7.4cqw;color:var(--orange);text-shadow:.7cqw .7cqw 0 #000;margin:0;line-height:1.2}
.sub{font-size:3.2cqw;color:var(--yellow);margin:0;line-height:1.6;text-shadow:.4cqw .4cqw 0 #000}
.lbl{font-size:2.6cqw;color:#c6cae8;margin:2cqw 0 0}
#nameBox{font-size:6.4cqw;letter-spacing:.4cqw;padding:2.4cqw 3cqw;border:.6cqw solid var(--orange);background:#000;min-width:72cqw;min-height:12cqw;display:flex;align-items:center;justify-content:center}
#nameBox .cur{animation:blink 1s steps(1) infinite;color:var(--orange)}
@keyframes blink{50%{opacity:0}}
/* Ranking estilo fliperama: NOME....TEMPO....PONTOS */
#board{justify-content:flex-start;padding-top:7cqw;gap:2.2cqw}
#board .big{font-size:8.6cqw;background:linear-gradient(#fff3c4,#ffb000 55%,#f26a1b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(.7cqw .7cqw 0 #000);margin-bottom:2cqw}
.hdr,.row{display:grid;grid-template-columns:5ch 1fr 9ch 8ch;width:100%;font-size:2.75cqw;line-height:1;white-space:pre;text-align:left}
.hdr{color:#a3a8cc;font-size:2.1cqw;padding:0 1cqw 1cqw;border-bottom:.4cqw solid #3a4180}
.hdr span:nth-child(3),.hdr span:nth-child(4),.row span:nth-child(3),.row span:nth-child(4){text-align:right}
.row{padding:1.25cqw 1cqw;text-shadow:.35cqw .35cqw 0 #000}
.row .nm{overflow:hidden}
.row .nm::after{content:" ...................................";color:#7d84c4}
.row .tm{color:#9fd3ff}
.row .pt{color:var(--yellow)}
.row.top1 .pos,.row.top1 .nm{color:var(--gold)}
.row.me{background:var(--orange)}
.row.me .nm::after{color:#ffd1b3}
.row.me .tm,.row.me .pt{color:#fff}
.row.gap{padding:.6cqw 1cqw;color:#7d84c4;justify-items:center;display:block;text-align:center}
.empty{font-size:2.8cqw;color:#a3a8cc;margin-top:6cqw}
/* Área de botões */
#ctrl{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3cqw;padding:3cqw 4cqw 4cqw;background:linear-gradient(#141a3d,#0b0e26);border-top:1cqw solid #000;position:relative}
#ctrl::before{content:"";position:absolute;left:0;right:0;top:0;height:1.2cqw;background:repeating-linear-gradient(-62deg,transparent 0 2.4cqw,var(--orange) 2.4cqw 4.4cqw);opacity:.9}
.panel{display:none;flex-direction:column;gap:2.6cqw;height:100%;justify-content:center}
.panel.on{display:flex}
button{font-family:inherit;color:#fff;border:0;cursor:pointer;touch-action:none}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;height:100%}
.arrow{background:var(--blue);border-radius:3cqw;box-shadow:0 1.6cqw 0 var(--blue-ink),inset 0 0 0 .6cqw rgba(255,255,255,.08);font-size:11cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;margin-bottom:1.6cqw}
.arrow small{font-size:2.6cqw;color:#c6cae8}
.arrow.down,.arrow:active{background:var(--orange);transform:translateY(1.2cqw);box-shadow:0 .4cqw 0 #a8430c}
.cta{background:var(--orange);border-radius:3cqw;box-shadow:0 1.6cqw 0 #a8430c;font-size:6cqw;padding:5cqw 2cqw;text-shadow:.5cqw .5cqw 0 #000}
.cta:active{transform:translateY(1.2cqw);box-shadow:0 .4cqw 0 #a8430c}
.tip{font-size:2.4cqw;color:#a3a8cc;text-align:center;line-height:1.7;margin:0}
.kb{display:grid;grid-template-columns:repeat(20,1fr);gap:1.2cqw .8cqw}
.kb button{grid-column:span 2}
.kb .gap1{grid-column:span 1;visibility:hidden}
#ctrl:has(#pEntry.on){padding:6cqw 7cqw 6cqw}
.kb button{background:#1c2278;border-radius:1.2cqw;font-size:3.4cqw;padding:1.4cqw 0;box-shadow:0 .6cqw 0 #0b0e26}
.kb button:active{background:var(--orange);transform:translateY(.6cqw);box-shadow:none}
.kb .w4{grid-column:span 4;font-size:2.4cqw}
.kb .w6{grid-column:span 6;font-size:2.8cqw}
.kb .w8{grid-column:span 8;font-size:2.8cqw}
.kb .ok{background:var(--orange);box-shadow:0 .8cqw 0 #a8430c}
.kb .sk{background:transparent;box-shadow:none;color:#a3a8cc;font-size:2.6cqw;text-decoration:underline}

/* Painel de fliperama */
#ctrl:has(#pTitle.on),#ctrl:has(#pPlay.on),#ctrl:has(#pBoard.on){background:#05060c;padding:4.5cqw 5cqw 5cqw}
#ctrl:has(#pTitle.on)::before,#ctrl:has(#pPlay.on)::before,#ctrl:has(#pBoard.on)::before{display:none}
.deck{position:relative;height:100%;border-radius:2.5cqw;background:radial-gradient(120% 90% at 50% 0%,#1d2150 0,#0b0d22 60%,#05060c 100%);border:1cqw solid #000;box-shadow:inset 0 0 0 .6cqw #f26a1b,inset 0 1.4cqw 3cqw rgba(0,0,0,.7);display:flex;align-items:center;justify-content:space-around;padding:6cqw 4cqw 6cqw}
.deck::before,.deck::after{content:"";position:absolute;width:2.4cqw;height:2.4cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9ccd9,#555a70);top:2.6cqw}
.deck::before{left:2.6cqw}.deck::after{right:2.6cqw}
.ab{background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:.6cqw}
.ab svg{display:block;filter:drop-shadow(0 1cqw 1.2cqw rgba(0,0,0,.6));overflow:visible}
.ab .cap{transition:transform .05s}
.ab.down .cap,.ab:active .cap{transform:translateY(5px)}
.lb{font-size:7cqw;color:#ffd25a;text-shadow:.4cqw .4cqw 0 #000}
#bStart .lb{font-size:5.5cqw}#bAgain .lb{font-size:4cqw}
.pl{position:absolute;top:2.4cqw;left:0;right:0;text-align:center;font-size:2.2cqw;color:#7d84c4;letter-spacing:.3cqw;margin:0}
#boardTip{top:auto;bottom:2.4cqw;color:#9fd3ff}
#pBoard .deck{padding-bottom:8cqw}

/* Tela inicial com logo e instrucoes */
#titleOv{justify-content:flex-start;padding:6cqw 7cqw 4cqw;gap:3cqw}
#logo{width:64cqw;height:auto;display:block;filter:drop-shadow(0 1.2cqw 0 rgba(0,0,0,.45))}
.how{width:100%;background:rgba(5,6,12,.78);border:.6cqw solid #f26a1b;border-radius:2cqw;padding:3.2cqw 3.4cqw;display:flex;flex-direction:column;gap:2.6cqw;box-shadow:0 1cqw 0 #000}
.how-t{margin:0;font-size:3.6cqw;color:#f26a1b;text-shadow:.4cqw .4cqw 0 #000}
.how-big{margin:0;font-size:3.3cqw;line-height:1.6;color:#fff;text-shadow:.4cqw .4cqw 0 #000}
.how-m{margin:0;font-size:2.1cqw;line-height:1.7;color:#c6cae8}
.how-m b{color:#ffd25a;font-weight:400}
.how-g{display:grid;grid-template-columns:1fr 1fr;gap:3cqw 2.4cqw;text-align:left}
.how-g>div{display:flex;align-items:center;gap:2cqw}
.how-g span{white-space:nowrap;font-size:2.1cqw;line-height:1.7;color:#fff}
.how-g em{font-style:normal;color:#ffd25a}
.how-g em.red{color:#ff6b4a}
.ic{flex:none;width:8cqw;height:8cqw;display:flex;align-items:center;justify-content:center;position:relative;font-style:normal}
.ic.box{background:linear-gradient(90deg,#b9864f 42%,#e3c49a 42% 58%,#b9864f 58%);box-shadow:inset 0 -1.2cqw 0 rgba(0,0,0,.25)}
.ic.gold{background:linear-gradient(90deg,#ffb000 42%,#fff3c4 42% 58%,#ffb000 58%);box-shadow:inset 0 -1.2cqw 0 rgba(0,0,0,.2)}
.ic.gnv{border-radius:50%;background:#2fbf71;color:#fff;font-size:2cqw}
.ic.obs .cone{width:0;height:0;border-left:3.4cqw solid transparent;border-right:3.4cqw solid transparent;border-bottom:7.6cqw solid #f26a1b;position:relative}
.ic.obs .cone::after{content:"";position:absolute;left:-1.5cqw;top:3.4cqw;width:3cqw;height:1cqw;background:#fff}
.rec{margin:0;font-size:2.6cqw;color:#9fd3ff;text-shadow:.4cqw .4cqw 0 #000}
</style></head>

<defs><radialGradient id="gbAgain" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffd25a"/><stop offset="1" stop-color="#b88a00"/></radialGradient>
<linearGradient id="rbAgain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5f78"/><stop offset=".5" stop-color="#15172a"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="sbAgain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b88a00"/><stop offset=".45" stop-color="#ffd25a"/><stop offset="1" stop-color="#b88a00"/></linearGradient></defs>

<ellipse cx="60" cy="52" rx="32" ry="15" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3"/>

</div>
<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=240,H=320,HZ=136,RS=1.3,TS=0.8;
  const SEG=200,ROAD=1100,DRAW=110,CAM_H=1000,CAM_D=0.84,RUMBLE=3;
  const LANES=[-0.62,0,0.62],PLAYER_Z=1000;
  const PX='"PS2P", monospace';
  const RKEY='gugaRunTotemRanking', BKEY='gugaRunTotemBest';
  const $=id=>document.getElementById(id);

  if(new URLSearchParams(location.search).has('zerar')){try{localStorage.removeItem(RKEY);localStorage.removeItem(BKEY)}catch(e){}}

  const track=[];
  function addRoad(len,curve){for(let i=0;i<len;i++){const a=len*0.2;const e=i<a?i/a:i>len-a?(len-i)/a:1;track.push(curve*e)}}
  [[60,0],[80,3],[50,0],[90,-4],[40,0],[70,2],[80,-2.5],[60,0],[100,4.5],[60,-3],[50,0],[80,-5],[70,3]].forEach(([l,c])=>addRoad(l,c));
  const TL=track.length;

  let memRank=[];
  function loadRank(){try{const r=JSON.parse(localStorage.getItem(RKEY)||'null');if(Array.isArray(r))return r}catch(e){}return memRank.slice()}
  function saveRank(r){memRank=r.slice();try{localStorage.setItem(RKEY,JSON.stringify(r))}catch(e){}}
  // Versao offline: um servidor local (servidor.ps1) grava o ranking em arquivo com backups.
  const HAS_SERVER=/^https?:$/.test(location.protocol)&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const PKEY='gugaRunTotemPending';
  function pending(){try{return JSON.parse(localStorage.getItem(PKEY)||'[]')}catch(e){return []}}
  function setPending(a){try{localStorage.setItem(PKEY,JSON.stringify(a))}catch(e){}}
  function merge(a,b){const m=new Map();a.concat(b).forEach(e=>{if(e&&e.id)m.set(e.id,e)});return [...m.values()].sort((x,y)=>y.s-x.s||y.ms-x.ms)}
  async function pushEntries(list){
    if(!HAS_SERVER||!list.length)return list;
    const left=[];
    for(const e of list){try{const r=await fetch('/api/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});if(!r.ok)throw 0}catch(err){left.push(e)}}
    return left;
  }
  async function syncServer(){
    if(!HAS_SERVER)return;
    try{
      const r=await fetch('/api/ranking',{cache:'no-store'});if(!r.ok)throw 0;
      const srv=await r.json();const local=loadRank();
      const ids=new Set(srv.map(e=>e.id));
      const missing=local.filter(e=>!ids.has(e.id));
      const all=merge(srv,local);saveRank(all);if(all.length)best=Math.max(best,all[0].s);
      setPending(await pushEntries(merge(pending(),missing)));
    }catch(e){}
  }
  syncServer();setInterval(syncServer,30000);
  let best=0;{const r=loadRank();if(r.length)best=r[0].s}

  let st;
  function reset(mode){st={mode:mode||'title',pos:0,speed:0,lane:1,px:0,items:new Map(),nextSeg:30,score:0,boxes:0,turbo:0,bg:0,t:0,ms:0,last:0}}
  reset();
  const score=()=>st.score+Math.floor(st.pos/400);

  // Tempo no formato do fliperama: 01'17"35
  function fmt(ms){const cs=Math.floor(ms/10),m=Math.floor(cs/6000),s=Math.floor(cs/100)%60,c=cs%100;return String(m).padStart(2,'0')+"'"+String(s).padStart(2,'0')+'"'+String(c).padStart(2,'0')}

  function put(s,o){if(!st.items.has(s))st.items.set(s,[]);st.items.get(s).push(o)}
  function spawnUpTo(absMax){
    while(st.nextSeg<absMax){
      const s=st.nextSeg,lanes=[0,1,2].sort(()=>Math.random()-.5);
      const hard=Math.min(1,st.pos/180000);
      const obs=Math.random()<0.3*hard?2:1;
      for(let i=0;i<obs;i++){const k=Math.random();put(s,{lane:lanes[i],type:k<.4?'cone':k<.75?'car':'hole'})}
      const n=3+Math.floor(Math.random()*3),gold=Math.random()<.15,gnv=!gold&&Math.random()<.08;
      for(let j=0;j<n;j++)put(s+5+j*3,{lane:lanes[2],type:gnv&&j===0?'gnv':gold&&j===n-1?'gold':'box'});
      st.nextSeg+=Math.max(15,36-Math.floor(hard*20));
    }
  }

  function update(now){
    st.t++;
    st.px+=(LANES[st.lane]-st.px)*0.25;
    if(st.mode==='title'||st.mode==='board'){st.pos+=40;st.bg+=track[Math.floor(st.pos/SEG)%TL]*0.25;return}
    if(st.mode!=='play')return;
    st.ms=now-st.start;
    const maxS=Math.min(165,40+st.pos/2200);
    st.speed+=(maxS-st.speed)*0.02;
    st.pos+=st.speed;
    const base=Math.floor(st.pos/SEG);
    st.bg+=track[base%TL]*st.speed*0.006;
    spawnUpTo(base+DRAW+5);
    if(st.turbo>0)st.turbo--;
    for(let s=base;s<=base+14;s++){
      const arr=st.items.get(s);if(!arr)continue;
      const relz=s*SEG-st.pos;
      for(const o of arr){
        if(o.done)continue;
        const collect=o.type==='box'||o.type==='gold'||o.type==='gnv';
        if(collect&&st.turbo>0&&relz>PLAYER_Z)o.lane=st.lane;
        if(relz<PLAYER_Z+120&&relz>PLAYER_Z-180&&Math.abs(LANES[o.lane]-st.px)<0.28){
          if(collect){o.done=true;st.boxes++;st.score+=o.type==='gold'?50:10;if(o.type==='gnv')st.turbo=360}
          else if(!(st.turbo>0&&o.type==='hole')){st.mode='over';st.final={s:score(),ms:st.ms,b:st.boxes};setTimeout(openEntry,900)}
        }
      }
    }
    for(const k of st.items.keys())if(k<base-2)st.items.delete(k);
  }

  // ---------- desenho ----------
  function quad(c,x1,y1,w1,x2,y2,w2){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x2-w2,y2);ctx.lineTo(x2+w2,y2);ctx.lineTo(x1+w1,y1);ctx.closePath();ctx.fill()}
  function layer(off,step,hs,color){
    ctx.fillStyle=color;const o=((off%step)+step)%step,i0=Math.floor(off/step);
    ctx.beginPath();ctx.moveTo(0,HZ+1);
    for(let i=-1;i<=W/step+1;i++){const h=hs[((i+i0)%hs.length+hs.length)%hs.length];const x=i*step-o;ctx.lineTo(x,HZ+1);ctx.lineTo(x+step/2,HZ-h);ctx.lineTo(x+step,HZ+1)}
    ctx.lineTo(W,HZ+1);ctx.closePath();ctx.fill();
  }
  function city(off){
    const step=14,hs=[18,30,22,40,26,16,34,24,44,20,28,36],o=((off%step)+step)%step,i0=Math.floor(off/step);
    for(let i=-1;i<=W/step+1;i++){
      const idx=((i+i0)%hs.length+hs.length)%hs.length,h=hs[idx],x=Math.round(i*step-o);
      ctx.fillStyle='#2a2160';ctx.fillRect(x,HZ-h,step-2,h+1);
      ctx.fillStyle='#ffd25a';for(let wy=HZ-h+4;wy<HZ-3;wy+=6)if((wy+idx)%3)ctx.fillRect(x+3,wy,2,2);
    }
  }
  function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,HZ);g.addColorStop(0,'#1b1f5e');g.addColorStop(.55,'#b2457e');g.addColorStop(1,'#ff9a3c');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,HZ+1);
    ctx.fillStyle='#ffd25a';const sx=W*0.7-((st.bg*0.2)%40);ctx.beginPath();ctx.arc(sx,HZ-26,20,0,7);ctx.fill();
    ctx.fillStyle='#ff9a3c';for(let y=HZ-22;y<HZ-6;y+=5)ctx.fillRect(sx-22,y,44,2);
    layer(st.bg*0.4,90,[30,46,22,52,36],'#5a2d82');
    city(st.bg*0.8);
    layer(st.bg*1.2,60,[10,16,8,14,12],'#1f4f4a');
  }
  function project(wx,z,camX){const s=CAM_D/z*RS;return{x:W/2+s*(wx-camX)*W/2,y:HZ+CAM_D/z*CAM_H*(H-HZ),w:s*ROAD*W/2,s}}
  function drawRoad(){
    const base=Math.floor(st.pos/SEG),pct=(st.pos%SEG)/SEG,camX=st.px*ROAD;
    let x=0,dx=-track[base%TL]*pct,maxy=H;const proj=[];
    for(let n=0;n<DRAW;n++){
      const s=base+n,z1=n*SEG-pct*SEG,z2=z1+SEG;
      const cx=x,ndx=dx;x+=dx;dx+=track[s%TL];
      if(z1<=20){proj[n]=null;continue}
      const p1=project(cx,z1,camX),p2=project(cx+ndx,z2,camX);
      proj[n]={p1,clip:maxy};
      if(p2.y>=maxy)continue;
      const alt=Math.floor(s/RUMBLE)%2;
      ctx.fillStyle=alt?'#3f8f3a':'#4a9f42';ctx.fillRect(0,p2.y,W,p1.y-p2.y+1);
      quad(alt?'#f26a1b':'#f3f3f3',p1.x,p1.y,p1.w*1.12,p2.x,p2.y,p2.w*1.12);
      quad(alt?'#5b5e6e':'#56596b',p1.x,p1.y,p1.w,p2.x,p2.y,p2.w);
      if(alt)for(const lx of[-0.31,0.31])quad('#ececec',p1.x+p1.w*lx,p1.y,p1.w*0.025,p2.x+p2.w*lx,p2.y,p2.w*0.025);
      maxy=p2.y;
    }
    for(let n=DRAW-1;n>0;n--){
      const arr=st.items.get(base+n),pr=proj[n];if(!arr||!pr)continue;
      ctx.save();ctx.beginPath();ctx.rect(0,0,W,pr.clip);ctx.clip();
      for(const o of arr)if(!o.done)sprite(o.type,pr.p1.x+pr.p1.w*LANES[o.lane],pr.p1.y,pr.p1.s*W/2);
      ctx.restore();
    }
  }
  function sprite(t,x,y,k){
    if(t==='box'||t==='gold'){
      const w=300*k;ctx.fillStyle=t==='gold'?'#ffb000':'#b9864f';ctx.fillRect(x-w/2,y-w,w,w);
      ctx.fillStyle=t==='gold'?'#fff3c4':'#e3c49a';ctx.fillRect(x-w*0.08,y-w,w*0.16,w);
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-w/2,y-w*0.12,w,w*0.12);
    }else if(t==='gnv'){
      const r=160*k;ctx.fillStyle='#2fbf71';ctx.beginPath();ctx.arc(x,y-r,r,0,7);ctx.fill();
      if(r>6){ctx.fillStyle='#fff';ctx.font=Math.round(r*0.55)+'px '+PX;ctx.textAlign='center';ctx.fillText('GNV',x,y-r+r*0.25)}
    }else if(t==='cone'){
      const w=260*k,h=320*k;ctx.fillStyle='#f26a1b';ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+w/2,y);ctx.lineTo(x-w/2,y);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(x-w*0.22,y-h*0.5,w*0.44,h*0.14);
    }else if(t==='hole'){
      ctx.fillStyle='#1c1e28';ctx.beginPath();ctx.ellipse(x,y-30*k,260*k,60*k,0,0,7);ctx.fill();
    }else{
      const w=470*k,h=300*k;ctx.fillStyle='#c0392b';ctx.fillRect(x-w/2,y-h,w,h*0.85);
      ctx.fillStyle='#9fd3ff';ctx.fillRect(x-w*0.35,y-h*0.92,w*0.7,h*0.3);
      ctx.fillStyle='#ffdf5a';ctx.fillRect(x-w*0.46,y-h*0.45,w*0.16,h*0.1);ctx.fillRect(x+w*0.3,y-h*0.45,w*0.16,h*0.1);
      ctx.fillStyle='#111';ctx.fillRect(x-w*0.45,y-h*0.15,w*0.18,h*0.15);ctx.fillRect(x+w*0.27,y-h*0.15,w*0.18,h*0.15);
    }
  }
  function truck(){
    // mesmo caminhão do jogo original (desenhado numa tela 320x240), reduzido para a tela vertical
    ctx.save();ctx.translate(W/2,H-8);ctx.scale(TS,TS);ctx.translate(-160,-240);
    const g=st.turbo>0,bob=st.mode==='play'&&st.t%8<4?1:0;
    const w=92,h=66,x=114,y=240-14-h-bob;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x+4,224,w-8,6);
    ctx.fillStyle=g?'#22a35f':'#2b33a8';ctx.fillRect(x,y,w,h);
    ctx.fillStyle=g?'#178a4e':'#1c2278';ctx.fillRect(x,y,w,5);ctx.fillRect(x+w/2-1,y+5,2,h-12);
    ctx.fillStyle=g?'#c8f5d9':'#f26a1b';
    for(let i=0;i<3;i++){const cy=y+26+i*10;ctx.beginPath();ctx.moveTo(x+4,cy+6);ctx.lineTo(x+16,cy);ctx.lineTo(x+16,cy+4);ctx.lineTo(x+8,cy+8);ctx.fill();ctx.beginPath();ctx.moveTo(x+w-4,cy+6);ctx.lineTo(x+w-16,cy);ctx.lineTo(x+w-16,cy+4);ctx.lineTo(x+w-8,cy+8);ctx.fill()}
    ctx.fillStyle='#fff';ctx.font='10px '+PX;ctx.textAlign='center';ctx.fillText('GH',x+w/2-12,y+24);
    ctx.fillStyle='#2b2b33';ctx.fillRect(x-2,y+h-6,w+4,6);
    ctx.fillStyle='#ff3b30';ctx.fillRect(x+2,y+h-14,10,5);ctx.fillRect(x+w-12,y+h-14,10,5);
    ctx.fillStyle='#ffcc00';for(let i=0;i<6;i++)ctx.fillRect(x+16+i*10+(i>2?2:0),y+h-5,5,3);
    ctx.fillStyle='#111';ctx.fillRect(x+4,y+h,16,8);ctx.fillRect(x+w-20,y+h,16,8);
    ctx.restore();
  }
  function txt(s,x,y,c,size,al){ctx.font=size+'px '+PX;ctx.textAlign=al||'left';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y)}
  function hud(){
    const sc=st.mode==='over'?st.final.s:score(), ms=st.mode==='over'?st.final.ms:st.ms;
    txt('PONTOS',12,17,'#fff',8);txt(String(sc).padStart(6,'0'),12,32,'#ffd25a',12);
    txt('RECORDE '+best,W-12,17,'#fff',8,'right');txt('CAIXAS '+st.boxes,W-12,31,'#ffb000',8,'right');
    txt('TEMPO',12,47,'#fff',8);txt(fmt(ms),12,60,'#9fd3ff',8);
    ctx.textAlign='right';ctx.fillStyle='rgba(14,18,51,.75)';ctx.fillRect(W-68,44,56,17);
    ctx.fillStyle='#fff';ctx.font='8px '+PX;ctx.fillText(String(Math.round(st.speed*0.9)).padStart(3,' ')+'KM/H',W-15,56);
    if(st.turbo>0&&st.t%20<14)txt('TURBO GNV!',W/2,76,'#2fbf71',10,'center');
  }
  function overlay(a,b,c,blink){
    ctx.fillStyle='rgba(14,18,51,.72)';ctx.fillRect(0,0,W,H);
    txt(a,W/2,110,'#f26a1b',22,'center');
    if(b)txt(b,W/2,140,'#fff',8,'center');
    if(c&&(!blink||st.t%50<32))txt(c,W/2,162,'#ffd25a',8,'center');
  }
  function draw(){
    drawBg();drawRoad();truck();
    if(st.mode==='play'||st.mode==='over')hud();
    if(st.mode==='title'){
      ctx.fillStyle='rgba(14,18,51,.55)';ctx.fillRect(0,0,W,H);
    }
    if(st.mode==='over'&&!uiOpen){ctx.fillStyle='rgba(14,18,51,.6)';ctx.fillRect(0,0,W,H);txt('FIM DA ROTA',W/2,140,'#f26a1b',18,'center')}
  }

  // ---------- telas e controles ----------
  let uiOpen=false,lastEntry=null,name='',attract=null,idle=null;
  const panels={title:$('pTitle'),play:$('pPlay'),entry:$('pEntry'),board:$('pBoard')};
  function panel(n){for(const k in panels)panels[k].classList.toggle('on',k===n)}
  function show(id,on){$(id).hidden=!on}

  function goTitle(){
    reset('title');uiOpen=false;show('entry',false);show('board',false);show('titleOv',true);$('recTxt').textContent=best?'RECORDE: '+best+' PONTOS':'';panel('title');
    clearTimeout(idle);clearInterval(attract);
    // modo vitrine: alterna a tela de título com o ranking
    attract=setInterval(()=>{if(st.mode==='title'&&loadRank().length){lastEntry=null;renderBoard();show('board',true);setTimeout(()=>{if(st.mode==='title')show('board',false)},7000)}},16000);
  }
  function start(){
    clearInterval(attract);clearTimeout(idle);
    reset('play');st.start=performance.now();uiOpen=false;show('entry',false);show('board',false);show('titleOv',false);panel('play');
  }
  function move(d){if(st.mode!=='play')return;st.lane=Math.max(0,Math.min(2,st.lane+d))}

  function openEntry(){
    if(st.mode!=='over')return;
    uiOpen=true;const f=st.final,top=loadRank();
    $('entryTitle').textContent=!top.length||f.s>top[0].s?'NOVO RECORDE!':'FIM DA ROTA';
    $('entryStats').innerHTML=f.s+' PONTOS<br>TEMPO '+fmt(f.ms);
    name='';$('nameTxt').textContent='';show('entry',true);panel('entry');
    clearTimeout(idle);idle=setTimeout(()=>save(true),60000);
  }
  function save(skip){
    clearTimeout(idle);
    const f=st.final,r=loadRank();
    if(!skip||name){lastEntry=Date.now()+'-'+Math.random();r.push({id:lastEntry,n:(name.trim()||'ANONIMO').slice(0,10),s:f.s,ms:f.ms,b:f.b});r.sort((a,b)=>b.s-a.s||b.ms-a.ms);saveRank(r);best=r[0].s;const ent=r.find(e=>e.id===lastEntry);setPending(pending().concat([ent]));pushEntries(pending()).then(setPending)}
    else lastEntry=null;
    st.mode='board';show('entry',false);renderBoard();show('board',true);panel('board');
    idle=setTimeout(goTitle,30000);
  }
  function rowEl(e,i,cls){
    const d=document.createElement('div');d.className='row'+(i===0?' top1':'')+(cls?' '+cls:'');
    const a=document.createElement('span');a.className='pos';a.textContent=String(i+1).padStart(2,' ')+'.';
    const b=document.createElement('span');b.className='nm';b.textContent=e.n;
    const c=document.createElement('span');c.className='tm';c.textContent=fmt(e.ms||0);
    const p=document.createElement('span');p.className='pt';p.textContent=e.s;
    d.append(a,b,c,p);return d;
  }
  function renderBoard(){
    const r=loadRank(),box=$('rows');box.innerHTML='';
    if(!r.length){const p=document.createElement('p');p.className='empty';p.textContent='NINGUEM NO RANKING AINDA';box.appendChild(p)}
    r.slice(0,10).forEach((e,i)=>box.appendChild(rowEl(e,i,lastEntry&&e.id===lastEntry?'me':'')));
    const mi=lastEntry?r.findIndex(e=>e.id===lastEntry):-1;
    if(mi>=10){const g=document.createElement('div');g.className='row gap';g.textContent='· · ·';box.appendChild(g);box.appendChild(rowEl(r[mi],mi,'me'))}
    $('boardTip').textContent=mi>=0?'VOCE FICOU EM '+(mi+1)+'º LUGAR!':'';
  }

  // teclado na tela
  const kb=$('kb');
  // teclado QWERTY
  const KEYS=['Q','W','E','R','T','Y','U','I','O','P','|','A','S','D','F','G','H','J','K','L','|','|','Z','X','C','V','B','N','M',['APAGAR','del','w4'],'|',['ESPACO','sp','w8'],['PULAR','skip','w4 sk'],['OK','ok','w8 ok']];
  KEYS.forEach(k=>{
    if(k==='|'){const g=document.createElement('span');g.className='gap1';kb.appendChild(g);return}
    const [t,v,c]=Array.isArray(k)?k:[k,k,''];
    const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.k=v;if(c)b.className=c;kb.appendChild(b);
  });
  function key(k){
    if(k==='ok')return save(false);
    if(k==='skip')return save(true);
    if(k==='del')name=name.slice(0,-1);
    else if(k==='sp'){if(name&&!name.endsWith(' ')&&name.length<10)name+=' '}
    else if(name.length<10)name+=k;
    $('nameTxt').textContent=name;
    clearTimeout(idle);idle=setTimeout(()=>save(true),60000);
  }
  kb.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();key(b.dataset.k)});

  function press(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');fn()});['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('down')))}
  press($('bL'),()=>move(-1));press($('bR'),()=>move(1));
  press($('bStart'),start);press($('bAgain'),start);
  // deslizar o dedo sobre o jogo também troca de faixa
  let sx=null;
  $('game').addEventListener('pointerdown',e=>{sx=e.clientX});
  $('game').addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(st.mode==='play'&&Math.abs(dx)>30)move(dx>0?1:-1)});
  document.addEventListener('contextmenu',e=>e.preventDefault());

  document.addEventListener('keydown',e=>{
    const k=e.key;
    if(st.mode==='over'&&uiOpen){
      if(k==='Enter'){e.preventDefault();key('ok')}
      else if(k==='Backspace'){e.preventDefault();key('del')}
      else if(k==='Escape')key('skip');
      else if(k===' '){e.preventDefault();key('sp')}
      else if(/^[a-zA-Z0-9]$/.test(k))key(k.toUpperCase());
      return;
    }
    if(st.mode==='play'){
      if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();move(-1)}
      else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();move(1)}
    }else if(st.mode==='title'||st.mode==='board'){
      if(k==='Enter'||k===' '||k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();start()}
    }
    if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}
  });

  let last=0;
  function loop(ts){if(ts-last>=15){update(ts);last=ts}draw();requestAnimationFrame(loop)}
  goTitle();
  (document.fonts&&document.fonts.load?document.fonts.load('10px "PS2P"'):Promise.resolve()).catch(()=>{}).then(()=>requestAnimationFrame(loop));
  window.__gr={st:()=>st,key,save,start,setFinal:(s,ms,b)=>{st.mode='over';st.final={s,ms,b};openEntry()}};
})();
</script>
</body></html>
